targets:
  small_gicp:
    kind: shared
    std: gnu++17
    sources:
      - src/registration_helper.cpp
      - src/registration_preparation.cpp
      - src/loop_registration.cpp
    public_include_dirs:
      - include
    deps:
      - robot_core_alg
      - openmp_runtime
    compile_options:
      - -fopenmp
    install: true
    install_deps:
      - robot_core_package
    install_files:
      cmake/small_gicp-config-version.cmake: lib/cmake/small_gicp/small_gicp-config-version.cmake
    cmake:
      directory: lib/cmake/small_gicp
      config: cmake/small_gicp-config.cmake.in
      exports:
        small_gicp-targets.cmake:
          small_gicp::small_gicp:
            target: small_gicp
            include_dirs:
              - include
            link_libraries:
              - robot_core::alg
              - OpenMP::OpenMP_CXX
